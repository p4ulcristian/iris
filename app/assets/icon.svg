<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="iris-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9c27b0"/>
      <stop offset="25%" style="stop-color:#2196f3"/>
      <stop offset="50%" style="stop-color:#009688"/>
      <stop offset="75%" style="stop-color:#ffd700"/>
      <stop offset="100%" style="stop-color:#ff9800"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="#0a0a0a"/>

  <!-- Outer ring - rainbow -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="url(#iris-gradient)" stroke-width="24" filter="url(#glow)"/>

  <!-- Inner iris pattern -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="url(#iris-gradient)" stroke-width="16" opacity="0.7"/>
  <circle cx="256" cy="256" r="90" fill="none" stroke="url(#iris-gradient)" stroke-width="10" opacity="0.5"/>

  <!-- Pupil -->
  <circle cx="256" cy="256" r="50" fill="#0a0a0a"/>

  <!-- Highlight -->
  <circle cx="230" cy="230" r="20" fill="#ffffff" opacity="0.3"/>
</svg>
