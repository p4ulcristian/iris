# Iris tmux configuration

# Status bar - hidden by default, shown when >1 window
set -g status off

# Status bar styling (when visible)
set -g status-position bottom
set -g status-style "bg=#1f1a28,fg=#c9b1d4"
set -g status-left ""
set -g status-right "#[bg=#c4a7e7,fg=#1f1a28,bold] + "
set -g window-status-format " #I:#W "
set -g window-status-current-format "#[bg=#c4a7e7,fg=#1f1a28,bold] #I:#W "
set -g window-status-separator ""

# Windows start at 1, not 0
set -g base-index 1
set -g renumber-windows on

# Auto show/hide status bar based on window count
set-hook -g after-new-window 'if -F "#{>:#{session_windows},1}" "set status on"'
set-hook -g pane-exited 'if -F "#{==:#{session_windows},1}" "set status off"'
set-hook -g session-window-changed 'if -F "#{==:#{session_windows},1}" "set status off"'

# ═══════════════════════════════════════════════════════════════
# PANE STYLING
# ═══════════════════════════════════════════════════════════════

# Pane border styling
set -g pane-border-status top
set -g pane-border-lines heavy
# Inactive borders are muted, active is bright (set dynamically by theme)
set -g pane-border-style "fg=#4e4258,bg=#4e4258"
set -g pane-active-border-style "fg=#c4a7e7,bg=#c4a7e7"
set -g pane-border-format "#[bg=#c9b1d4,fg=#1f1a28,bold] #{pane_title} #[fg=#6e5a7a]✕ "

# Prevent applications from changing pane titles
set -g allow-set-title off

# ═══════════════════════════════════════════════════════════════
# GENERAL SETTINGS
# ═══════════════════════════════════════════════════════════════

# Use true colors
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# Mouse support
set -g mouse on

# Use emacs keys for command prompt (Escape cancels directly)
set -g status-keys emacs

# ═══════════════════════════════════════════════════════════════
# KEY BINDINGS
# ═══════════════════════════════════════════════════════════════

# Escape cancels command prompt
bind-key -T edit-mode-vi Escape send-keys -X cancel

# Ctrl+f to toggle fullscreen
bind-key -n C-f resize-pane -Z

# Ctrl+l to rotate layouts
bind-key -n C-l next-layout

# Ctrl+n to summon a new god (popup with god selection)
bind-key -n C-n display-popup -h 18 -w 50 -E "/home/p4ulcristian/Work/iris/brain/cli/spawn-picker.sh"

# Alt+l to list gods
bind-key -n M-l run-shell "iris list"

# Alt+k to banish a god by name
bind-key -n M-k command-prompt -p "󰅗 Banish god:" "run-shell 'iris kill %%'"

# Ctrl+k to force kill current pane (including Claude)
# If last pane, spawn fresh shell first to keep window alive
bind-key -n C-k run-shell 'old_pane=$(tmux display-message -p "#{pane_id}"); if [ $(tmux list-panes | wc -l) -eq 1 ]; then tmux split-window -c "/home/p4ulcristian/Work/iris"; fi; kill -9 $(tmux display-message -p -t $old_pane "#{pane_pid}") 2>/dev/null; tmux kill-pane -t $old_pane'

# Prefix + S for summon (alternative)
bind-key S command-prompt -p "󰊕 Summon god:" "run-shell 'iris spawn -q \"%%\"'"

# Ctrl+r to open new terminal pane in iris folder
bind-key -n C-r split-window -c "/home/p4ulcristian/Work/iris"

# Ctrl+t to show theme menu (fzf with live preview)
bind-key -n C-t display-popup -h 24 -w 50 -E "/home/p4ulcristian/Work/iris/brain/cli/theme-picker.sh"

# Ctrl+h to show hotkeys help
bind-key -n C-h display-popup -h 28 -w 50 -E "cat /home/p4ulcristian/Work/iris/brain/cli/hotkeys.txt && read -n 1"

# Ctrl+s to show skills
bind-key -n C-s display-popup -h 10 -w 50 -E "cat /home/p4ulcristian/Work/iris/brain/cli/skills.txt && read -n 1"

# ═══════════════════════════════════════════════════════════════
# WINDOW (TAB) MANAGEMENT
# ═══════════════════════════════════════════════════════════════

# Alt+n to create new window with realm name
bind-key -n M-n run-shell 'tmux new-window -c "/home/p4ulcristian/Work/iris" -n "$(/home/p4ulcristian/Work/iris/brain/cli/realm-name.sh)"'

# Alt+, and Alt+. to navigate windows
bind-key -n M-, previous-window
bind-key -n M-. next-window

# Alt+1-9 to focus windows
bind-key -n M-1 select-window -t :1
bind-key -n M-2 select-window -t :2
bind-key -n M-3 select-window -t :3
bind-key -n M-4 select-window -t :4
bind-key -n M-5 select-window -t :5
bind-key -n M-6 select-window -t :6
bind-key -n M-7 select-window -t :7
bind-key -n M-8 select-window -t :8
bind-key -n M-9 select-window -t :9

# Alt+Shift+1-9 to move pane to window (creates if doesn't exist)
bind-key -n M-! if-shell "tmux list-windows | grep -q '^1:'" "join-pane -t :1" "new-window -t :1 && join-pane -t :1"
bind-key -n M-@ if-shell "tmux list-windows | grep -q '^2:'" "join-pane -t :2" "new-window -t :2 && join-pane -t :2"
bind-key -n 'M-#' if-shell "tmux list-windows | grep -q '^3:'" "join-pane -t :3" "new-window -t :3 && join-pane -t :3"
bind-key -n 'M-$' if-shell "tmux list-windows | grep -q '^4:'" "join-pane -t :4" "new-window -t :4 && join-pane -t :4"
bind-key -n M-% if-shell "tmux list-windows | grep -q '^5:'" "join-pane -t :5" "new-window -t :5 && join-pane -t :5"
bind-key -n M-^ if-shell "tmux list-windows | grep -q '^6:'" "join-pane -t :6" "new-window -t :6 && join-pane -t :6"
bind-key -n M-& if-shell "tmux list-windows | grep -q '^7:'" "join-pane -t :7" "new-window -t :7 && join-pane -t :7"
bind-key -n M-* if-shell "tmux list-windows | grep -q '^8:'" "join-pane -t :8" "new-window -t :8 && join-pane -t :8"
bind-key -n M-( if-shell "tmux list-windows | grep -q '^9:'" "join-pane -t :9" "new-window -t :9 && join-pane -t :9"

# Alt+Shift+n to move pane to new window
bind-key -n M-N break-pane

# Alt+w to rename current window
bind-key -n M-w command-prompt -p "Rename window:" "rename-window '%%'"

# ═══════════════════════════════════════════════════════════════
# MOUSE BINDINGS
# ═══════════════════════════════════════════════════════════════

# Disable auto-copy on mouse selection (highlight without copying)
unbind -T copy-mode MouseDragEnd1Pane
unbind -T copy-mode-vi MouseDragEnd1Pane

# Right-click on tab → close that window
bind-key -n MouseDown3Status kill-window -t =

# Middle-click on pane border/title → force close that pane
bind-key -n MouseDown2Border run-shell 'kill -9 $(tmux display-message -p -t = "#{pane_pid}") 2>/dev/null; tmux kill-pane -t ='

# Double-click on pane border/title → force close that pane
bind-key -n DoubleClick1Border run-shell 'kill -9 $(tmux display-message -p -t = "#{pane_pid}") 2>/dev/null; tmux kill-pane -t ='

# Left-click on [+] button (status-right) → new window
bind-key -n MouseDown1StatusRight run-shell '/home/p4ulcristian/Work/iris/brain/cli/realm-name.sh | xargs -I {} tmux new-window -c "/home/p4ulcristian/Work/iris" -n "{}"'
