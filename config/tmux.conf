# Iris tmux configuration

# ═══════════════════════════════════════════════════════════════
# BOTTOM STATUS BAR
# ═══════════════════════════════════════════════════════════════

set -g status on
set -g status-position bottom
set -g status-style "bg=#1f1a28,fg=#c9b1d4"
set -g status-left-length 50
set -g status-right-length 50
set -g status-left "#[bg=#c4a7e7,fg=#1f1a28,bold] ☰ "
set -g status-right "#[fg=#6e5a7a]#S #[fg=#4e4258]│#[fg=#6e5a7a] #{session_windows}W #{window_panes}P "
set -g window-status-format " #I:#W "
set -g window-status-current-format "#[bg=#c4a7e7,fg=#1f1a28,bold] #I:#W "
set -g window-status-separator ""

# Windows start at 1, not 0
set -g base-index 1
set -g renumber-windows on

# Menu button click + Ctrl+M
bind-key -n MouseDown1StatusLeft display-popup -h 15 -w 40 -E "$IRIS_DIR/brain/cli/menu.sh"
bind-key -n C-m display-popup -h 15 -w 40 -E "$IRIS_DIR/brain/cli/menu.sh"

# ═══════════════════════════════════════════════════════════════
# PANE STYLING
# ═══════════════════════════════════════════════════════════════

# Pane border styling
set -g pane-border-status top
set -g pane-border-lines heavy
# Inactive borders are muted, active is bright (set dynamically by theme)
set -g pane-border-style "fg=#4e4258,bg=#4e4258"
set -g pane-active-border-style "fg=#c4a7e7,bg=#c4a7e7"
set -g pane-border-format "#[bg=#c9b1d4,fg=#1f1a28,bold] #{pane_title} #[fg=#6e5a7a]✕ "

# Prevent applications from changing pane titles
set -g allow-set-title off

# ═══════════════════════════════════════════════════════════════
# GENERAL SETTINGS
# ═══════════════════════════════════════════════════════════════

# Use true colors
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# Mouse support
set -g mouse on

# Use emacs keys for command prompt (Escape cancels directly)
set -g status-keys emacs

# ═══════════════════════════════════════════════════════════════
# KEY BINDINGS
# ═══════════════════════════════════════════════════════════════

# Escape cancels command prompt
bind-key -T edit-mode-vi Escape send-keys -X cancel

# Ctrl+f to toggle fullscreen
bind-key -n C-f resize-pane -Z

# Ctrl+l to rotate layouts
bind-key -n C-l next-layout

# Ctrl+n to summon a new god (popup with god selection)
bind-key -n C-n display-popup -h 18 -w 50 -E "$IRIS_DIR/brain/cli/spawn-picker.sh"

# Alt+l to list gods
bind-key -n M-l run-shell "iris list"

# Alt+k to kill current window (tab) - with confirmation
bind-key -n M-k run-shell -b 'printf "%s\n%s\n" "#{window_id}" "#{window_name}" > /tmp/iris-kill-tab && tmux display-popup -h 10 -w 40 -E "$IRIS_DIR/brain/cli/kill-tab.sh"'

# Ctrl+k to force kill current pane (including Claude) - with confirmation
bind-key -n C-k run-shell -b 'printf "%s\n%s\n%s\n%s\n%s\n%s\n" "#{window_id}" "#{pane_id}" "#{pane_pid}" "#{window_panes}" "#{session_windows}" "#{pane_title}" > /tmp/iris-kill-pane && tmux display-popup -h 10 -w 70 -E "$IRIS_DIR/brain/cli/kill-pane.sh"'

# Prefix + S for summon (alternative)
bind-key S command-prompt -p "󰊕 Summon god:" "run-shell 'iris spawn -q \"%%\"'"

# Ctrl+r to open new terminal pane in iris folder
bind-key -n C-r run-shell 'tmux split-window -c "$IRIS_DIR"'

# Ctrl+t to show theme menu (fzf with live preview)
bind-key -n C-t display-popup -h 24 -w 50 -E "$IRIS_DIR/brain/cli/theme-picker.sh"

# Ctrl+h to resume a Claude session
bind-key -n C-h display-popup -h 20 -w 70 -E "$IRIS_DIR/brain/cli/resume-picker.sh"

# Ctrl+s to show skills
bind-key -n C-s display-popup -h 10 -w 50 -E "cat $IRIS_DIR/brain/cli/skills.txt && read -n 1"

# ═══════════════════════════════════════════════════════════════
# WINDOW (TAB) MANAGEMENT
# ═══════════════════════════════════════════════════════════════

# Alt+n to spawn god in a new tab
bind-key -n M-n display-popup -h 18 -w 50 -E "$IRIS_DIR/brain/cli/spawn-picker.sh --new-tab"

# Alt+, and Alt+. to navigate windows
bind-key -n M-, previous-window
bind-key -n M-. next-window

# Alt+1-9 to focus windows
bind-key -n M-1 select-window -t :1
bind-key -n M-2 select-window -t :2
bind-key -n M-3 select-window -t :3
bind-key -n M-4 select-window -t :4
bind-key -n M-5 select-window -t :5
bind-key -n M-6 select-window -t :6
bind-key -n M-7 select-window -t :7
bind-key -n M-8 select-window -t :8
bind-key -n M-9 select-window -t :9

# Alt+Shift+1-9 to move pane to window (creates if doesn't exist)
bind-key -n M-! if-shell "tmux list-windows | grep -q '^1:'" "join-pane -t :1" "new-window -t :1 && join-pane -t :1"
bind-key -n M-@ if-shell "tmux list-windows | grep -q '^2:'" "join-pane -t :2" "new-window -t :2 && join-pane -t :2"
bind-key -n 'M-#' if-shell "tmux list-windows | grep -q '^3:'" "join-pane -t :3" "new-window -t :3 && join-pane -t :3"
bind-key -n 'M-$' if-shell "tmux list-windows | grep -q '^4:'" "join-pane -t :4" "new-window -t :4 && join-pane -t :4"
bind-key -n M-% if-shell "tmux list-windows | grep -q '^5:'" "join-pane -t :5" "new-window -t :5 && join-pane -t :5"
bind-key -n M-^ if-shell "tmux list-windows | grep -q '^6:'" "join-pane -t :6" "new-window -t :6 && join-pane -t :6"
bind-key -n M-& if-shell "tmux list-windows | grep -q '^7:'" "join-pane -t :7" "new-window -t :7 && join-pane -t :7"
bind-key -n M-* if-shell "tmux list-windows | grep -q '^8:'" "join-pane -t :8" "new-window -t :8 && join-pane -t :8"
bind-key -n M-( if-shell "tmux list-windows | grep -q '^9:'" "join-pane -t :9" "new-window -t :9 && join-pane -t :9"

# Alt+Shift+n to move pane to new window
bind-key -n M-N break-pane

# Alt+w to rename current window
bind-key -n M-w command-prompt -p "Rename window:" "rename-window '%%'"

# ═══════════════════════════════════════════════════════════════
# MOUSE BINDINGS
# ═══════════════════════════════════════════════════════════════

# Disable auto-copy on mouse selection (highlight without copying)
unbind -T copy-mode MouseDragEnd1Pane
unbind -T copy-mode-vi MouseDragEnd1Pane

# Right-click on tab → close that window (with confirmation)
bind-key -n MouseDown3Status run-shell -b 'printf "%s\n%s\n" "#{window_id}" "#{window_name}" > /tmp/iris-kill-tab && tmux display-popup -h 10 -w 40 -E "$IRIS_DIR/brain/cli/kill-tab.sh"'

# Middle-click on pane border/title → force close that pane (with confirmation)
bind-key -n MouseDown2Border run-shell -b 'printf "%s\n%s\n%s\n%s\n%s\n%s\n" "#{window_id}" "#{pane_id}" "#{pane_pid}" "#{window_panes}" "#{session_windows}" "#{pane_title}" > /tmp/iris-kill-pane && tmux display-popup -h 10 -w 70 -E "$IRIS_DIR/brain/cli/kill-pane.sh"'

# Double-click on pane border/title → force close that pane (with confirmation)
bind-key -n DoubleClick1Border run-shell -b 'printf "%s\n%s\n%s\n%s\n%s\n%s\n" "#{window_id}" "#{pane_id}" "#{pane_pid}" "#{window_panes}" "#{session_windows}" "#{pane_title}" > /tmp/iris-kill-pane && tmux display-popup -h 10 -w 70 -E "$IRIS_DIR/brain/cli/kill-pane.sh"'

# Left-click on [+] button (status-right) → new window
bind-key -n MouseDown1StatusRight run-shell '$IRIS_DIR/brain/cli/realm-name.sh | xargs -I {} tmux new-window -c "$IRIS_DIR" -n "{}"'
