# Iris tmux configuration

# Disable status bar
set -g status off

# ═══════════════════════════════════════════════════════════════
# PANE STYLING
# ═══════════════════════════════════════════════════════════════

# Pane border styling
set -g pane-border-status top
set -g pane-border-lines heavy
set -g pane-border-style "fg=#c9b1d4,bg=#c9b1d4"
set -g pane-active-border-style "fg=#c9b1d4,bg=#c9b1d4"
set -g pane-border-format "#[bg=#c9b1d4,fg=#1f1a28,bold] #{pane_title} "

# Prevent applications from changing pane titles
set -g allow-set-title off

# ═══════════════════════════════════════════════════════════════
# GENERAL SETTINGS
# ═══════════════════════════════════════════════════════════════

# Use true colors
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# Mouse support
set -g mouse on

# Use emacs keys for command prompt (Escape cancels directly)
set -g status-keys emacs

# ═══════════════════════════════════════════════════════════════
# KEY BINDINGS
# ═══════════════════════════════════════════════════════════════

# Escape cancels command prompt
bind-key -T edit-mode-vi Escape send-keys -X cancel

# Ctrl+f to toggle fullscreen
bind-key -n C-f resize-pane -Z

# Ctrl+l to rotate layouts
bind-key -n C-l next-layout

# Ctrl+n to spawn a new Iris shade (fastest)
bind-key -n C-n command-prompt -p "󰊕 Spawn shade:" "run-shell 'iris spawn -q \"%%\"'"

# Alt+l to list shades
bind-key -n M-l run-shell "iris list"

# Alt+k to kill a shade by name
bind-key -n M-k command-prompt -p "󰅗 Kill shade:" "run-shell 'iris kill %%'"

# Ctrl+k to kill current pane
bind-key -n C-k kill-pane

# Prefix + S for spawn (alternative)
bind-key S command-prompt -p "󰊕 Spawn shade:" "run-shell 'iris spawn -q \"%%\"'"

# Ctrl+r to open new terminal pane in iris folder
bind-key -n C-r split-window -c "/home/p4ulcristian/Work/iris"
