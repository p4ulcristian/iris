# Iris Themes
# Run: node scripts/generate-themes.js after editing

erebus:
  label: "Erebus"
  description: "Primordial darkness"
  colors:
    bg-primary: "#050506"
    bg-secondary: "#0a0a0c"
    bg-tertiary: "#101014"
    text-primary: "#9090a0"
    text-secondary: "#606070"
    text-tertiary: "#404048"
    border: "#18181f"
    accent: "#6b4c9a"
  terminal:
    bg-lightness: 6
    bg-saturation: 0.8
    fg-lightness: 70
    saturation: 0.25
    # ANSI modifiers - muted, slightly cool
    ansi-saturation: 0.6
    ansi-warmth: -10
    hue-blend: 0.2
  gods:
    zeus: "#b8a038"
    apollo: "#c4a030"
    artemis: "#4a7c74"
    athena: "#5878a8"
    hermes: "#b87830"
    hades: "#7848a0"
    poseidon: "#487888"
    hera: "#a04878"
    ares: "#a83838"
    hephaestus: "#986040"
    aphrodite: "#b85878"
    dionysus: "#6838a0"
    demeter: "#488048"

