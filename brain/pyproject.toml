[project]
name = "iris-brain"
version = "0.1.0"
description = "Iris brain - voice and orchestration services"
requires-python = ">=3.11"

dependencies = [
    "flask",
    "requests",
    "evdev",
    "sounddevice",
    "soundfile",
    "numpy",
]

[tool.setuptools]
py-modules = []

[tool.setuptools.packages.find]
include = ["cli*", "hear*", "speak*", "express*", "wake*"]

[project.optional-dependencies]
stt = [
    "nemo_toolkit[asr]",
]
tts = [
    "torch",
    "transformers==4.51.3",
    "diffusers",
    "accelerate",
    "flash-attn",
]
ui = [
    "PyGObject",
]

[tool.uv]
dev-dependencies = []
