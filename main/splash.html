<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      background: #0a0a0f;
      overflow: hidden;
      user-select: none;
      -webkit-app-region: drag;
    }

    .container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse at center, #12121a 0%, #0a0a0f 70%);
    }

    .eye {
      position: relative;
      width: 120px;
      height: 60px;
      background: linear-gradient(135deg, #1a1a2e 0%, #0f0f1a 100%);
      border-radius: 50%;
      border: 2px solid #2a2a4a;
      overflow: hidden;
      animation: blink 4s ease-in-out infinite;
    }

    .iris {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 40px;
      height: 40px;
      background: radial-gradient(circle at 30% 30%,
        #7c3aed 0%,
        #5b21b6 40%,
        #3b0764 100%);
      border-radius: 50%;
      box-shadow:
        0 0 20px #7c3aed88,
        inset 0 0 10px #00000066;
    }

    .pupil {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 16px;
      height: 16px;
      background: #0a0a0f;
      border-radius: 50%;
      box-shadow: inset 0 0 4px #000;
    }

    .pupil::after {
      content: '';
      position: absolute;
      top: 3px;
      left: 3px;
      width: 4px;
      height: 4px;
      background: #ffffff88;
      border-radius: 50%;
    }

    .lid {
      position: absolute;
      width: 100%;
      height: 100%;
      background: #0a0a0f;
      top: -100%;
      animation: lid-blink 4s ease-in-out infinite;
    }

    .text {
      margin-top: 24px;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 14px;
      font-weight: 300;
      letter-spacing: 0.2em;
      color: #4a4a6a;
      text-transform: uppercase;
    }

    @keyframes blink {
      0%, 90%, 100% {
        height: 60px;
        border-radius: 50%;
      }
      95% {
        height: 4px;
        border-radius: 50% 50% 50% 50% / 20% 20% 80% 80%;
      }
    }

    @keyframes lid-blink {
      0%, 90%, 100% { top: -100%; }
      95% { top: 0; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="eye">
      <div class="lid"></div>
      <div class="iris">
        <div class="pupil"></div>
      </div>
    </div>
    <div class="text">Awakening</div>
  </div>
</body>
</html>
