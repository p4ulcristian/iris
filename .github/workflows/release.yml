name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Set version from tag
        working-directory: ./app
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          jq --arg v "$VERSION" '.version = $v' package.json > tmp.json && mv tmp.json package.json

      - name: Install dependencies
        working-directory: ./app
        run: bun install

      - name: Build Linux
        working-directory: ./app
        run: bun run build:linux

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            app/dist/*.AppImage
            app/dist/*.deb

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Set version from tag
        working-directory: ./app
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          jq --arg v "$VERSION" '.version = $v' package.json > tmp.json && mv tmp.json package.json

      - name: Install dependencies
        working-directory: ./app
        run: bun install

      - name: Build macOS
        working-directory: ./app
        run: bun run build:mac

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-artifacts
          path: app/dist/*.zip

  release:
    needs: [build-linux, build-mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-artifacts
          path: artifacts

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: mac-artifacts
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          repository: p4ulcristian/iris-releases
          token: ${{ secrets.RELEASES_TOKEN }}
          files: artifacts/*
          generate_release_notes: false
          body: |
            ## Requirements

            **All platforms:**
            - [Claude CLI](https://github.com/anthropics/claude-code) - `npm install -g @anthropic-ai/claude-code && claude login`

            **Linux:**
            - `dtach` - for session persistence
            - Voice features (optional): `uv`, `wtype`, `gtk4-layer-shell`

            **macOS:**
            - `dtach` - `brew install dtach`
            - Voice features not yet supported on macOS

            ## macOS Installation

            1. Extract the zip
            2. Move Iris.app to Applications
            3. Run in terminal:
               ```bash
               xattr -cr /Applications/Iris.app
               ```
            4. Open Iris from Applications

            > The `xattr` command removes the quarantine flag since the app isn't code-signed.
