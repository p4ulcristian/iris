[project]
name = "echo"
version = "0.4.0"
description = "Push-to-talk voice assistant for Wayland with STT and TTS"
requires-python = ">=3.10"
dependencies = [
    "nemo_toolkit[asr]",
    "sounddevice",
    "numpy",
    "evdev",
    "flask",
    "librosa",
    "torch",
    "transformers",
    "soundfile",
    "huggingface-hub",
    "accelerate",
    "pyyaml",
    "vibevoice @ file:///home/paul/Work/vibevoice",
]

[project.scripts]
echo = "echo.server:main"

[tool.setuptools.packages.find]
include = ["echo*"]
